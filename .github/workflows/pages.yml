# Publicerar kartan på GitHub Pages med realtidspositioner som uppdateras var 5:e minut.
# Kräver: repo-hemligheterna TRAFIKLAB_RT_KEY och TRAFIKLAB_STATIC_KEY,
# samt Settings → Pages → Source: "GitHub Actions".
name: Publicera spårkarta

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'     # GitHub kör schemat på bästa vilja – ofta 5–15 min mellan körningar
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Statisk GTFS (58 MB) hämtas högst var 3:e dygn – Bronze-kvoten är 50 hämtningar/månad.
      # Återställ senaste cache; spara bara när en ny zip faktiskt har hämtats (nyckel = filens hash).
      - name: Återställ statisk GTFS
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: gtfs-sl-zip-none
          restore-keys: gtfs-sl-zip-

      - name: Hämta realtidspositioner
        env:
          TRAFIKLAB_RT_KEY: ${{ secrets.TRAFIKLAB_RT_KEY }}
          TRAFIKLAB_STATIC_KEY: ${{ secrets.TRAFIKLAB_STATIC_KEY }}
        run: python3 server.py --snapshot site/api/vehicles

      - name: Spara statisk GTFS
        if: hashFiles('cache/sl.zip') != ''
        uses: actions/cache/save@v4
        continue-on-error: true          # finns redan för samma zip → inget att spara
        with:
          path: cache
          key: gtfs-sl-zip-${{ hashFiles('cache/sl.zip') }}

      - name: Bygg sajten
        run: |
          cp public/index.html site/index.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
