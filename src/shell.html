  :root{--bg:#3a4045;--panel:#2f3439;--line:#4c535a;--ink:#fff;--muted:#b9bec3;--y:#ffe500}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif}
  #map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  #map.dragging{cursor:grabbing}
  #map text{font-family:inherit}
  .route path{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .route,.dot,.pill,.lbl,.term,.veh{transition:opacity .2s}
  .hit{fill:none;stroke:transparent;stroke-width:22;pointer-events:stroke;cursor:pointer}
  .dot{fill:#fff;cursor:pointer;stroke:transparent;stroke-width:12}
  .pill{cursor:pointer}
  .lbl{font-size:17px;font-weight:500;fill:#fff;cursor:pointer}
  .tlbl{font-size:23px;font-weight:500;fill:#fff;letter-spacing:2.6px}
  .title{font-size:104px;font-weight:600;fill:#fff;letter-spacing:-.5px}
  .rule{stroke:#8a9096;stroke-width:1.5}
  .lhead{font-size:28px;font-weight:600;fill:#fff}
  .ltxt{font-size:17.5px;font-weight:500;fill:#fff}
  .ltxt.small{font-size:16px;fill:#c9cdd1}
  .btxt{font-size:20.5px;font-weight:600;fill:#fff;text-anchor:middle}
  #map .y{fill:var(--y)}
  .badge{cursor:pointer}
  .oneway{fill:none;stroke:#fff;stroke-width:1.6}
  #map.lod .lbl{display:none}

  #map.has-sel .route:not(.sel){opacity:.22;filter:saturate(.35) brightness(.55)}
  #map.has-sel .dot:not(.sel),#map.has-sel .pill:not(.sel),#map.has-sel .lbl:not(.sel),
  #map.has-sel .term:not(.sel){opacity:.18}
  #map.has-sel .veh:not(.sel){display:none}
  #map.has-sel .badge.sel rect{stroke:#fff;stroke-width:2.5}
  .dot.focus{r:7;stroke:var(--y);stroke-width:3}
  .lbl.focus{fill:var(--y)}
  .pill.focus line:first-child{stroke:var(--y)}

  .veh{cursor:pointer}
  .veh.vsel .vbody{stroke:var(--y);stroke-width:3.5;r:10}
  #map.has-sel .veh.vsel{opacity:1}
  .veh text{font-size:9.5px;font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  #search{position:fixed;top:12px;right:12px;width:240px;padding:10px 12px;font:inherit;font-size:16px;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;outline:none}
  #search::placeholder{color:var(--muted)}
  #search:focus{border-color:var(--y)}
  #info{position:fixed;right:12px;top:62px;width:310px;max-height:calc(100% - 140px);overflow:auto;padding:14px 16px;display:none}
  #info.show{display:block}
  #info h2{margin:0 0 4px;font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px;padding-right:20px}
  #info .sub{color:var(--muted);font-size:15px;margin-bottom:12px}
  #info .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:0;color:#fff;font:inherit;font-weight:600;font-size:17px;min-width:40px;height:26px;padding:0 8px;cursor:pointer}
  #info ol{list-style:none;margin:0;padding:0 0 0 6px;border-left:5px solid var(--c,#999)}
  #info li{padding:3px 0 3px 14px;position:relative;cursor:pointer;font-size:16px}
  #info li:hover{color:var(--y)}
  #info li.cur{color:var(--y);font-weight:600}
  #info li.cur::before{background:var(--y);width:12px;height:12px;margin-top:-6px;left:-11px}
  #info .also{margin:0 0 12px;font-size:14px;color:var(--muted)}
  #info .also .chips{margin-top:6px}
  #info li::before{content:"";position:absolute;left:-9px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#fff}
  #info ol.trip{padding-left:6px}
  #info ol.trip li{display:flex;gap:12px;align-items:baseline;padding:5px 0 5px 14px}
  .trip .tm{width:44px;flex:none;font-variant-numeric:tabular-nums;font-weight:600}
  .trip .tm s{display:block;font-weight:400;color:var(--muted);font-size:12.5px;line-height:1.1}
  .trip .nm{flex:1}
  .trip .pl{margin-left:8px;font-size:12.5px;color:var(--muted)}
  .trip .rel{flex:none;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
  .trip li.passed{color:#8a9096}
  .trip li.passed::before{background:#8a9096}
  .trip li.next .nm,.trip li.here .nm{color:var(--y);font-weight:600}
  .trip li.next .rel,.trip li.here .rel{color:var(--y)}
  .trip li.here::before{background:var(--y);width:12px;height:12px;margin-top:-6px;left:-11px}
  .trip li.mark{color:var(--muted);font-size:13.5px;font-style:italic;cursor:default;padding:2px 0 2px 14px}
  .trip li.mark::before{background:var(--c);border:2px solid var(--y);width:14px;height:14px;margin-top:-9px;left:-12px}
  #info .sub b{font-weight:600;color:#fff}
  #info .sub b.bad{color:#ff8a80}
  #info .follow{border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:14px;border-radius:7px;padding:4px 10px;margin:0 0 12px;cursor:pointer}
  #info .follow.on{background:var(--y);color:#222;border-color:var(--y);font-weight:600}
  /* Linjevy */
  #info .lv-head{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin:4px 0 6px;padding:0 4px}
  #info .lv{position:relative;--rh:30px;--tx:44px}
  #info .lv-track{position:absolute;left:var(--tx);width:6px;margin-left:-3px;top:calc(var(--rh) / 2);bottom:calc(var(--rh) / 2);
    background:var(--c);border-radius:3px}
  #info ol.lv-stops{list-style:none;margin:0;padding:0;border-left:0}
  #info ol.lv-stops li{height:var(--rh);display:flex;align-items:center;padding:0 0 0 calc(var(--tx) + 42px);position:relative;cursor:pointer}
  #info .lv-stops li::before{left:var(--tx);top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;background:#fff;border:0}
  #info .lv-stops li.cur::before{background:var(--y);width:14px;height:14px;margin:-7px 0 0 -7px}
  #info .lv-stops li.cur span{color:var(--y);font-weight:600}
  #info .lv-stops li:hover span{color:var(--y)}
  #info .lv-veh{position:absolute;inset:0;pointer-events:none}
  #info .vm{position:absolute;left:calc(var(--tx) + 18px);width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
    background:var(--c);border:2px solid #fff;color:#fff;font-size:8px;line-height:1;padding:0;display:flex;align-items:center;
    justify-content:center;cursor:pointer;pointer-events:auto;transition:top .25s linear;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  #info .vm.up{left:calc(var(--tx) - 18px)}
  #info .vm.vsel,#info .vm:hover{border-color:var(--y);transform:scale(1.2)}
  #info .branch{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  #info ol.deps{border-left:0;padding:0}
  #info ol.deps li{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
  #info ol.deps li::before{display:none}
  .deps .tm{width:42px;font-variant-numeric:tabular-nums;font-weight:600}
  .deps .chip{min-width:34px;height:22px;font-size:15px;padding:0 6px;pointer-events:none}
  .deps .nm{flex:1}
  .deps .rel{color:var(--y);font-size:14px;font-variant-numeric:tabular-nums}
  .deps .bad{color:#ff8a80;font-size:13px}.deps .muted{color:var(--muted);font-size:13px}
  #info .foot{margin-top:12px;font-size:12.5px;color:var(--muted)}
  #info .close{position:absolute;right:10px;top:8px;border:0;background:none;color:var(--muted);font-size:24px;cursor:pointer}
  #ctrl{position:fixed;right:12px;bottom:12px;display:flex;gap:8px;align-items:stretch}
  #zoom{display:flex;overflow:hidden}
  #zoom button{width:42px;height:42px;border:0;background:var(--panel);color:#fff;font-size:22px;cursor:pointer}
  #zoom button+button{border-left:1px solid var(--line)}
  #veh{display:flex;align-items:center;gap:10px;padding:0 12px;font-size:16px}
  #veh label{display:flex;align-items:center;gap:6px;cursor:pointer}
  #veh input[type=range]{width:90px;accent-color:var(--y)}
  #modes{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  #modes button{border:0;background:none;color:var(--muted);font:inherit;font-size:15px;padding:5px 10px;cursor:pointer}
  #modes button+button{border-left:1px solid var(--line)}
  #modes button.on{background:var(--y);color:#222;font-weight:600}
  #vstatus{font-size:14.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
  .dot-live{width:9px;height:9px;border-radius:50%;background:#2ecc71;box-shadow:0 0 0 0 rgba(46,204,113,.6);animation:pulse 2s infinite;display:inline-block}
  .dot-live.wait{background:#aaa;animation:none}
  .dot-live.err{background:#e74c3c}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.6)}70%{box-shadow:0 0 0 7px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
  #veh:not(.demo) #speed{display:none}
  @media (max-width:760px){
    #search{left:12px;right:12px;width:auto}
    #info{left:12px;right:12px;width:auto;top:auto;bottom:66px;max-height:40%}
    #veh input[type=range]{width:60px}
    #vstatus{display:none}
    #ctrl{left:12px;justify-content:space-between}
  }
</style>
</head>
<body>
<svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="Interaktiv spårtrafikkarta">
  <g id="viewport">
    <g id="gLegend"></g><g id="gRoutes"></g><g id="gHit"></g><g id="gPills"></g><g id="gStations"></g>
    <g id="gLabels"></g><g id="gDeco"></g>
  </g>
  <g id="gVehicles"></g>
</svg>
<input id="search" list="stationList" placeholder="Sök station…" autocomplete="off">
<datalist id="stationList"></datalist>
<div id="info" class="card"></div>
<div id="ctrl">
  <div id="veh" class="card">
    <div id="modes"><button data-mode="live">Live</button><button data-mode="demo">Demo</button><button data-mode="off">Av</button></div>
    <span id="vstatus"></span>
    <input type="range" id="speed" min="0.25" max="6" step="0.25" value="1.5" title="Demohastighet">
  </div>
  <div id="zoom" class="card">
    <button id="zout" title="Zooma ut">−</button>
    <button id="zin" title="Zooma in">+</button>
    <button id="zfit" title="Visa hela kartan" style="font-size:17px">⤢</button>
  </div>
</div>
<script>/*DATA*/</script>
<script>/*APP*/</script>
</body>
</html>
