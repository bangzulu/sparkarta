  :root{--bg:#3a4045;--panel:#2f3439;--line:#4c535a;--ink:#fff;--muted:#b9bec3;--y:#ffe500}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif}
  #map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  #map.dragging{cursor:grabbing}
  #map text{font-family:inherit}
  .route path{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .route,.dot,.pill,.lbl,.term,.veh{transition:opacity .2s}
  .hit{fill:none;stroke:transparent;stroke-width:22;pointer-events:stroke;cursor:pointer}
  .dot{fill:#fff;cursor:pointer;stroke:transparent;stroke-width:12}
  .pill{cursor:pointer}
  .lbl{font-size:17px;font-weight:500;fill:#fff;cursor:pointer}
  .tlbl{font-size:23px;font-weight:500;fill:#fff;letter-spacing:2.6px}
  .title{font-size:104px;font-weight:600;fill:#fff;letter-spacing:-.5px}
  .rule{stroke:#8a9096;stroke-width:1.5}
  .lhead{font-size:28px;font-weight:600;fill:#fff}
  .ltxt{font-size:17.5px;font-weight:500;fill:#fff}
  .ltxt.small{font-size:16px;fill:#c9cdd1}
  .btxt{font-size:20.5px;font-weight:600;fill:#fff;text-anchor:middle}
  #map .y{fill:var(--y)}
  .badge{cursor:pointer}
  .oneway{fill:none;stroke:#fff;stroke-width:1.6}
  #map.lod .lbl{display:none}

  #map.has-sel .route:not(.sel){opacity:.22;filter:saturate(.35) brightness(.55)}
  #map.has-sel .dot:not(.sel),#map.has-sel .pill:not(.sel),#map.has-sel .lbl:not(.sel),
  #map.has-sel .term:not(.sel){opacity:.18}
  #map.has-sel .veh:not(.sel){display:none}
  #map.has-sel .badge.sel rect{stroke:#fff;stroke-width:2.5}
  .dot.focus{r:7;stroke:var(--y);stroke-width:3}
  .lbl.focus{fill:var(--y)}
  .pill.focus line:first-child{stroke:var(--y)}

  .veh{cursor:pointer}
  .veh.vsel .vbody{stroke:var(--y);stroke-width:3.5;r:10}
  #map.has-sel .veh.vsel{opacity:1}
  .veh text{font-size:9.5px;font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  #info{position:fixed;right:12px;top:12px;width:310px;max-height:calc(100% - 90px);overflow:auto;padding:14px 16px;display:none}
  #info.show{display:block}
  #info h2{margin:0 0 4px;font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px;padding-right:20px}
  #info .sub{color:var(--muted);font-size:15px;margin-bottom:12px}
  #info .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:0;color:#fff;font:inherit;font-weight:600;font-size:17px;min-width:40px;height:26px;padding:0 8px;cursor:pointer}
  #info ol{list-style:none;margin:0;padding:0 0 0 6px;border-left:5px solid var(--c,#999)}
  #info li{padding:3px 0 3px 14px;position:relative;cursor:pointer;font-size:16px}
  #info li:hover{color:var(--y)}
  #info li.cur{color:var(--y);font-weight:600}
  #info li.cur::before{background:var(--y);width:12px;height:12px;margin-top:-6px;left:-11px}
  #info .also{margin:0 0 12px;font-size:14px;color:var(--muted)}
  #info .also .chips{margin-top:6px}
  #info li::before{content:"";position:absolute;left:-9px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#fff}
  #info ol.trip{padding-left:6px}
  #info ol.trip li{display:flex;gap:12px;align-items:baseline;padding:5px 0 5px 14px}
  .trip .tm{width:44px;flex:none;font-variant-numeric:tabular-nums;font-weight:600}
  .trip .tm s{display:block;font-weight:400;color:var(--muted);font-size:12.5px;line-height:1.1}
  .trip .nm{flex:1}
  .trip .pl{margin-left:8px;font-size:12.5px;color:var(--muted)}
  .trip .rel{flex:none;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
  .trip li.passed{color:#8a9096}
  .trip li.passed::before{background:#8a9096}
  .trip li.next .nm,.trip li.here .nm{color:var(--y);font-weight:600}
  .trip li.next .rel,.trip li.here .rel{color:var(--y)}
  .trip li.here::before{background:var(--y);width:12px;height:12px;margin-top:-6px;left:-11px}
  .trip li.mark{color:var(--muted);font-size:13.5px;font-style:italic;cursor:default;padding:2px 0 2px 14px}
  .trip li.mark::before{background:var(--c);border:2px solid var(--y);width:14px;height:14px;margin-top:-9px;left:-12px}
  #info .sub b{font-weight:600;color:#fff}
  #info .sub b.bad{color:#ff8a80}
  #info .follow{border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:14px;border-radius:7px;padding:4px 10px;margin:0 0 12px;cursor:pointer}
  #info .follow.on{background:var(--y);color:#222;border-color:var(--y);font-weight:600}
  /* Linjevy */
  #info .lv-head{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin:4px 0 6px;padding:0 4px}
  #info .lv{position:relative;--rh:30px;--tx:44px}
  #info .lv-track{position:absolute;left:var(--tx);width:6px;margin-left:-3px;top:calc(var(--rh) / 2);bottom:calc(var(--rh) / 2);
    background:var(--c);border-radius:3px}
  #info ol.lv-stops{list-style:none;margin:0;padding:0;border-left:0}
  #info ol.lv-stops li{height:var(--rh);display:flex;align-items:center;padding:0 0 0 calc(var(--tx) + 42px);position:relative;cursor:pointer}
  #info .lv-stops li::before{left:var(--tx);top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;background:#fff;border:0}
  #info .lv-stops li.cur::before{background:var(--y);width:14px;height:14px;margin:-7px 0 0 -7px}
  #info .lv-stops li.cur span{color:var(--y);font-weight:600}
  #info .lv-stops li:hover span{color:var(--y)}
  #info .lv-veh{position:absolute;inset:0;pointer-events:none}
  #info .vm{position:absolute;left:calc(var(--tx) + 18px);width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
    background:var(--c);border:2px solid #fff;color:#fff;font-size:8px;line-height:1;padding:0;display:flex;align-items:center;
    justify-content:center;cursor:pointer;pointer-events:auto;transition:top .25s linear;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  #info .vm.up{left:calc(var(--tx) - 18px)}
  #info .vm.vsel,#info .vm:hover{border-color:var(--y);transform:scale(1.2)}
  #info .chips.filter .chip{transition:opacity .15s}
  #info .chips.filter .chip.dim{opacity:.35}
  #info .chips.filter .chip.dim:hover{opacity:.7}
  #info .chips.filter .chip.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px #fff}
  #info .branch{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  #info ol.deps{border-left:0;padding:0}
  #info ol.deps li{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
  #info ol.deps li::before{display:none}
  .deps .tm{width:42px;font-variant-numeric:tabular-nums;font-weight:600}
  .deps .chip{min-width:34px;height:22px;font-size:15px;padding:0 6px;pointer-events:none}
  .deps .nm{flex:1}
  .deps .rel{color:var(--y);font-size:14px;font-variant-numeric:tabular-nums}
  .deps .bad{color:#ff8a80;font-size:13px}.deps .muted{color:var(--muted);font-size:13px}
  #info .foot{margin-top:12px;font-size:12.5px;color:var(--muted)}
  #info .close{position:absolute;right:10px;top:8px;border:0;background:none;color:var(--muted);font-size:24px;cursor:pointer}
  #ctrl{position:fixed;right:12px;bottom:12px;display:flex;gap:8px;align-items:stretch}
  #zoom{display:flex;overflow:hidden}

/* =========================================================================
   FORDON – API för realtid
   TrackMap.setVehicles([{ id, line, from, to, progress, label? }])
     line     linje-id ('14')
     from/to  stations-id för föregående och nästa stopp (ordningen = färdriktning)
     progress 0..1 mellan stoppen

    el('text', { y: 3.3 }, ge).textContent = v.label ?? l.id;

let mode = 'off';
const DEMO_SPEED = 1.5;
const live = { ok: false, tried: false, data: null, updated: 0, skew: 0, veh: new Map(), timer: 0 };
const LIVE_URL = 'api/vehicles';
let MAX_AHEAD = 3;            // rulla högst så många stopp förbi senaste mätningen
const FREEZE_AFTER = 240;       // sekunder utan ny mätning → stanna

function clearVehicles() { [...vehicles.keys()].forEach(removeVehicle); live.veh.clear(); }
function setMode(m) {
  if (m === mode) return;
  if (mode === 'demo') stopDemo();
  if (m !== 'api') clearVehicles();
  mode = m;
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('#veh')?.classList.toggle('demo', m === 'demo');
  if (m === 'demo') startDemo();
  if (m === 'live') { live.updated = 0; pollLive(); }
  if (m !== 'live') clearTimeout(live.timer);
  status();
  kick();
}
async function pollLive() {
  clearTimeout(live.timer);
  try {
    const r = await fetch(LIVE_URL, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    live.ok = true; live.tried = true;
    live.skew = j.now - Date.now() / 1000;
    live.data = j;
    if (mode === 'live' && j.updated && j.updated !== live.updated) { live.updated = j.updated; applyLive(j.vehicles); }
  } catch (e) {
    live.tried = true;
    live.error = String(e);
    if (!live.ok && window.SNAPSHOT && mode === 'live') {
      // Ingen server – spela upp inbäddad ögonblicksbild som om det vore nu
      const j = window.SNAPSHOT;
      live.snapshot = true; live.ok = true; MAX_AHEAD = 30;
      live.skew = j.now - Date.now() / 1000;
      live.data = j; live.updated = j.updated;
      applyLive(j.vehicles);
      status();
      return;
    }
    if (!live.ok && mode === 'live') { setMode('demo'); }
  }
  status();
  if (mode === 'live' && !live.snapshot) live.timer = setTimeout(pollLive, 10000);
}
function fmtDelay(s) {
  const m = Math.round(s / 60);
  return Math.abs(m) < 1 ? 'i tid' : (m > 0 ? `+${m} min` : `${m} min`);
}
function applyLive(list) {
  const seen = new Set();
  list.forEach(v => {
    if (!LINE[v.line] || !LINE[v.draw || v.line] || v.stops.length < 1) return;
    seen.add(v.id);
    v.title = `${LINE[v.line].name} mot ${ST[v.to]?.name || ''} · ${fmtDelay(v.delay)}`;
    const p = livePos(v, Date.now() / 1000 + live.skew);
    if (!p) return;
    v.pos = p;
    live.veh.set(v.id, v);
    upsertVehicle({ id: v.id, line: v.line, draw: v.draw, title: v.title, ...p }, vehicles.has(v.id));
  });
  [...live.veh.keys()].forEach(id => { if (!seen.has(id)) { live.veh.delete(id); removeVehicle(id); } });
  if (selVeh) renderVehPanel();
  kick();
}
function livePos(v, now) {
  const n = v.stops.length, k0 = Math.min(v.k || 0, Math.max(0, n - 2));
  if (n === 1) return { from: v.stops[0], to: null, progress: 0, seg: 0, at: 0 };
  const t = Math.min(now, v.ts + (live.snapshot ? 1800 : FREEZE_AFTER)) - v.delay;
  for (let j = k0; j < n - 1 && j <= k0 + MAX_AHEAD; j++) {
    if (t < v.dep[j]) {
      if (j === k0 && v.f >= 0.02) return { from: v.stops[j], to: v.stops[j + 1], progress: v.f, seg: j, at: -1 };
      return { from: v.stops[j], to: v.stops[j + 1], progress: 0, seg: j, at: j };
    }
    if (t < v.arr[j + 1]) {
      let p = (t - v.dep[j]) / Math.max(1, v.arr[j + 1] - v.dep[j]);
      if (j === k0) p = Math.max(p, v.f);
      return { from: v.stops[j], to: v.stops[j + 1], progress: p, seg: j, at: p >= 0.999 ? j + 1 : -1 };
    }
  }
  const j = Math.min(n - 1, k0 + MAX_AHEAD + 1);
  return { from: v.stops[j - 1], to: v.stops[j], progress: 1, seg: j - 1, at: j };
}
function stepLive() {
  const now = Date.now() / 1000 + live.skew;
  live.veh.forEach(v => { const p = livePos(v, now); if (p) { v.pos = p; upsertVehicle({ id: v.id, line: v.line, draw: v.draw, title: v.title, ...p }, false); } });
  followStep();
}
/* ---------- Valt fordon: tur med ankomsttider ---------- */
const hhmm = t => new Date(t * 1000).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
function zoomToStation(id, minK = 1.6) {
  const s = ST[id], W = svg.clientWidth, H = svg.clientHeight, k = Math.max(view.k, minK);
  const mob = W < 760, cx = mob ? W / 2 : (W - 330) / 2, cy = mob ? H * 0.3 : H / 2;
  animateTo({ k, tx: cx - s.x * k, ty: cy - s.y * k });
}
function setFollow(on) {
  follow = on;
  const b = $('#info .follow');
  if (b) { b.classList.toggle('on', on); b.textContent = on ? 'Följer fordonet' : 'Följ fordonet'; }
}
function followStep() {
  if (!follow || !selVeh || animating || pointers.size) return;
  const V = vehicles.get(selVeh);
  if (!V) return;
  const W = svg.clientWidth, H = svg.clientHeight, mob = W < 760;
  const cx = mob ? W / 2 : (W - 330) / 2, cy = mob ? H * 0.3 : H / 2;
  const dx = cx - (V.cur.x * view.k + view.tx), dy = cy - (V.cur.y * view.k + view.ty);
  if (Math.abs(dx) + Math.abs(dy) < 0.5) return;
  view.tx += dx * 0.08; view.ty += dy * 0.08;
  applyView();
}
function showVehicle(id) {
  const V = vehicles.get(id), v = live.veh.get(id);
  if (!V) return;
  if (!v) return selectLine(V.line, false);          // demofordon saknar tidtabell
  if (sel !== v.line) selectLine(v.line, false);
  setFocus(null);
  selVeh = id;
  document.querySelectorAll('.veh.vsel').forEach(e => e.classList.remove('vsel'));
  vehEls.get(id).classList.add('vsel');
  renderVehPanel(true);
  const W = svg.clientWidth, H = svg.clientHeight, mob = W < 760, k = Math.max(view.k, 1.5);
  const cx = mob ? W / 2 : (W - 330) / 2, cy = mob ? H * 0.3 : H / 2;
  animateTo({ k, tx: cx - V.cur.x * k, ty: cy - V.cur.y * k });
  setTimeout(() => selVeh === id && setFollow(true), 520);
}
function renderVehPanel(first) {
  const info = $('#info'), v = live.veh.get(selVeh);
  if (!v) {
    const sub = info.querySelector('.sub');
    if (sub) sub.textContent = 'Fordonet finns inte längre i realtidsflödet.';
    return;
  }
  const l = LINE[v.line], now = Date.now() / 1000 + live.skew, p = v.pos || livePos(v, now);
  const n = v.stops.length;
  const next = p.at >= 0 ? p.at : p.seg + 1;      // första stopp som inte passerats
  const rows = [];
  for (let i = 0; i < n; i++) {
    const sched = i === 0 ? v.dep[0] : v.arr[i], est = sched + v.delay;
    const passed = i < next, here = i === p.at;
    const late = Math.abs(v.delay) >= 60 && !passed;
    const mins = Math.round((est - now) / 60);
    const rel = here ? 'här nu' : !passed && i >= next ? (mins <= 0 ? 'nu' : `${mins} min`) : '';
    const plat = v.plat && v.plat[i] ? `<span class="pl">spår ${v.plat[i]}</span>` : '';
    if (i === p.seg + 1 && p.at < 0) rows.push(`<li class="mark"><span class="tm"></span><span class="nm">Mellan ${ST[v.stops[p.seg]].name} och ${ST[v.stops[i]].name}</span></li>`);
    rows.push(`<li data-zoom="${v.stops[i]}" class="${passed && !here ? 'passed' : ''}${here ? ' here' : ''}${i === next && !here ? ' next' : ''}">
      <span class="tm">${hhmm(est)}${late ? `<s>${hhmm(sched)}</s>` : ''}</span>
      <span class="nm">${ST[v.stops[i]].name}${plat}</span><span class="rel">${rel}</span></li>`);
  }
  const delayTxt = Math.abs(v.delay) < 60 ? 'I tid' : v.delay > 0 ? `${Math.round(v.delay / 60)} min sen` : `${Math.round(-v.delay / 60)} min tidig`;
  const upd = live.data && live.data.updated ? hhmm(live.data.updated) + ':' + String(new Date(live.data.updated * 1000).getSeconds()).padStart(2, '0') : '';
  const scroll = info.querySelector('ol')?.parentNode === info ? info.scrollTop : 0;
  info.style.setProperty('--c', colorOf(l));
  info.innerHTML = `<button class="close" aria-label="Stäng">×</button>
    <h2>${chip(l)}<span>mot ${ST[v.to].name}</span></h2>
    <div class="sub">${l.name} · <b class="${v.delay >= 120 ? 'bad' : ''}">${delayTxt}</b> · position ${upd}</div>
    <button class="follow${follow ? ' on' : ''}">${follow ? 'Följer fordonet' : 'Följ fordonet'}</button>
    <ol class="trip">${rows.join('')}</ol>
    <div class="foot">Tider = tidtabell + aktuell försening (beräknat). Fordon ${v.id}</div>`;
  info.classList.add('show');
  if (first) { const nx = info.querySelector('li.next,li.here'); if (nx) nx.scrollIntoView({ block: 'center' }); }
  else info.scrollTop = scroll;
}
setInterval(() => selVeh && renderVehPanel(), 1000);

function status() {
  const el = $('#vstatus');
  if (!el) return;
  if (mode === 'live') {
    const d = live.data;
    if (!d || !d.updated) { el.innerHTML = '<i class="dot-live wait"></i>Väntar på första realtidsdata…'; return; }
    const age = Math.round(Date.now() / 1000 + live.skew - d.updated);
    const t = new Date(d.updated * 1000).toLocaleTimeString('sv-SE');
    if (live.snapshot) { el.innerHTML = `<i class="dot-live wait"></i>${live.veh.size} fordon · ögonblicksbild ${t}`; el.title = 'Riktiga positioner från Trafiklab, uppspelade från tidpunkten då bilden togs.'; return; }
    el.innerHTML = `<i class="dot-live${d.error ? ' err' : ''}"></i>${live.veh.size} fordon · ${t}` +
      (d.error ? ` · <span title="${d.error.replace(/"/g, '')}">fel</span>` : '');
    el.title = `Senast uppdaterad för ${age} s sedan. Servern hämtar ny data var ${Math.round(d.poll)}:e sekund.`;
  } else if (mode === 'demo') el.textContent = live.ok ? 'Simulerade fordon' : 'Simulerade fordon (ingen server)';
  else if (mode === 'api') el.textContent = 'Fordon via API';
  else el.textContent = 'Fordon dolda';
}
setInterval(() => mode === 'live' && status(), 5000);
$('#modes')?.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.mode === 'live' && !live.ok) { live.tried = false; mode = 'off'; setMode('live'); return; }
  setMode(b.dataset.mode);
});

window.TrackMap = {
  lines: LINE, stations: ST, setVehicles, removeVehicle, pointOnLine,
  selectLine, clearSelection: clearSel, showStation, startDemo, stopDemo,
  stationIdByName: n => byName[String(n).toLowerCase()], setMode,
  setView: (k, tx, ty) => { Object.assign(view, { k, tx, ty }); applyView(); },
};

(document.fonts?.ready || Promise.resolve()).then(() => fitText.forEach(([t, w]) => {
  if (t.getComputedTextLength() > w) { t.setAttribute('textLength', w); t.setAttribute('lengthAdjust', 'spacingAndGlyphs'); }
}));
fitAll(false);
// Starta i live-läge om servern svarar, annars demo
if (/nodemo/.test(location.hash)) setMode('off');
else if (location.protocol.startsWith('http') || window.SNAPSHOT) setMode('live');
else setMode('demo');
})();
</script>
</body>
</html>
